# =============================================================================
# 📦 PLUGINS
# =============================================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'MunifTanjim/tmux-mode-indicator'

# Theme
set -g @plugin 'vaaleyard/tmux-dotbar'
set -g @tmux-dotbar-right true
set -g @tmux-dotbar-bg "#161616"
set -g @tmux-dotbar-status-right-text " CPU #{cpu_percentage} | %H:%M "

# CPU Status Indicator (Must be loaded AFTER theme)
set -g @plugin 'tmux-plugins/tmux-cpu'

# Automatic restore configuration (Must be the LAST plugin)
set -g @plugin 'tmux-plugins/tmux-continuum'
# set -g @continuum-boot 'on'
set -g @continuum-restore 'on'




# =============================================================================
# ⌨️ PREFIX & KEYBINDINGS
# =============================================================================
# Change prefix to Ctrl + Space
unbind C-b
set-option -g prefix C-Space
bind-key C-Space last-window

# Vim-style pane navigation (repeatable)
bind -r k select-pane -U 
bind -r j select-pane -D 
bind -r h select-pane -L 
bind -r l select-pane -R

# Toggle status bar display with Prefix + b
bind-key b set-option status

# =============================================================================
# ⚙️ GENERAL SETTINGS
# =============================================================================
set-option -g history-limit 10000
set -g status-interval 1
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -g set-titles on
set -g set-titles-string "#{R:⠀,#{e|-:#{e|/:#{e|*:#{client_width},3},7},10}}tmux ~"

# =============================================================================
# 🚀 INITIALIZE TPM (Keep at the very bottom)
# =============================================================================
# Auto-install TPM if missing
if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"

# Run TPM
run ~/.config/tmux/plugins/tpm/tpm